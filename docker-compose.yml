version: '3.8'

services:
  ros2_env:
    build: .
    container_name: ros2_hil_env
    # 호스트의 디렉토리를 컨테이너에 동기화
    volumes:
      - ./ros2_ws/src:/ros2_ws/src
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    # GUI 출력을 위한 환경변수
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    # ROS2 노드 간 통신을 위해 호스트 네트워크 사용
    network_mode: host
    # 컨테이너를 백그라운드에서 유지
    stdin_open: true 
    tty: true        
    command: /bin/bash